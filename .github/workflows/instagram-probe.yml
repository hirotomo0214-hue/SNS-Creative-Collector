name: Instagram Probe

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: Instagram search keyword
        required: true
        default: ティーフレックス
        type: string
  issues:
    types: [opened, reopened, edited]

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[ig-probe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve keyword
        id: inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_KEYWORD: ${{ inputs.keyword }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            KEYWORD="$INPUT_KEYWORD"
          else
            KEYWORD=$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^keyword:[[:space:]]*//p' | head -n1)
          fi
          [ -n "$KEYWORD" ] || KEYWORD='ティーフレックス'
          echo "keyword=$KEYWORD" >> "$GITHUB_OUTPUT"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Prepare Instagram storageState files
        shell: bash
        env:
          IG_STORAGE_STATE_01: ${{ secrets.IG_STORAGE_STATE_01 }}
          IG_STORAGE_STATE_02: ${{ secrets.IG_STORAGE_STATE_02 }}
          IG_STORAGE_STATE_03: ${{ secrets.IG_STORAGE_STATE_03 }}
        run: |
          set -e
          FILES=""
          for N in 01 02 03; do
            VAR="IG_STORAGE_STATE_${N}"; VALUE="${!VAR:-}"
            if [ -n "$VALUE" ]; then
              FILE="$RUNNER_TEMP/instagram_state_${N}.json"
              printf '%s' "$VALUE" | base64 --decode > "$FILE"
              chmod 600 "$FILE"
              if [ -z "$FILES" ]; then FILES="$FILE"; else FILES="$FILES:$FILE"; fi
            fi
          done
          if [ -z "$FILES" ]; then echo "No Instagram storageState secrets are configured"; exit 1; fi
          echo "IG_STORAGE_STATE_FILES=$FILES" >> "$GITHUB_ENV"
      - name: Probe current Instagram search UI
        run: python instagram_ui_search_probe.py --keyword "${{ steps.inputs.outputs.keyword }}" --output instagram_ui_search_probe.json
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: instagram-ui-probe-result
          path: instagram_ui_search_probe.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary Instagram sessions
        if: always()
        shell: bash
        run: |
          IFS=':' read -ra FILES <<< "${IG_STORAGE_STATE_FILES:-}"
          for FILE in "${FILES[@]}"; do [ -n "$FILE" ] && rm -f "$FILE"; done
