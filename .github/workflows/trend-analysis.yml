name: Trend Analysis

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, reopened]

jobs:
  analyze:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[trend-analysis]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aggregate SNS research patterns
        run: |
          python trend_aggregator.py --input trend_test_snapshot.json --output trend_report.json --as-of 2026-08-29 --current-days 7 --baseline-days 28 --min-posts 2
      - name: Validate normalization and output
        run: |
          python - <<'PY'
          import json
          d=json.load(open('trend_report.json', encoding='utf-8'))
          assert d['duplicate_rows_removed'] >= 2, d
          assert d['current_usable_rows'] > 0, d
          assert isinstance(d['signals'], list), d
          print('duplicates_removed=', d['duplicate_rows_removed'])
          print('current_usable_rows=', d['current_usable_rows'])
          print('missing_classification=', d['missing_classification_count'])
          print('signals=', len(d['signals']))
          PY
      - name: Generate Teaflex transfer recommendations
        run: |
          python recommendation_generator.py --trend trend_report.json --snapshot trend_test_snapshot.json --project 'Teaflex(ティーフレックス)' --output campaign_recommendations.json
      - name: Generate IF proposal pack
        run: |
          python if_proposal_generator.py --recommendations campaign_recommendations.json --output if_proposal_pack.json
      - name: Validate proposal separation
        run: |
          python - <<'PY'
          import json
          d=json.load(open('if_proposal_pack.json', encoding='utf-8'))
          assert d['status'] == 'proposal_candidate', d
          t=d['tracking_fields']
          assert t['adopted'] is None and t['actual_post_url'] is None and t['cv'] is None, d
          print('proposal/actual separation=OK')
          PY
      - name: Learn from actual posts and CV
        run: |
          python feedback_learning.py --input feedback_test_snapshot.json --output feedback_learning_report.json
      - name: Validate feedback guardrails
        run: |
          python - <<'PY'
          import json
          d=json.load(open('feedback_learning_report.json', encoding='utf-8'))
          assert d['mode'] == 'actual_post_cv_feedback', d
          assert d['usable_rows'] == 6, d
          assert len(d['skipped_rows']) == 1, d
          offer=next(s for s in d['signals'] if s['kind']=='structure' and s['name']=='オファー起点型')
          assert offer['posts'] == 5, offer
          assert offer['accounts'] >= 3, offer
          assert offer['confidence'] == 'medium', offer
          print('actual-post feedback separation=OK')
          print('offer_signal=', offer)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trend-analysis-result
          path: |
            trend_report.json
            campaign_recommendations.json
            if_proposal_pack.json
            feedback_learning_report.json
          retention-days: 7
