name: Trend Analysis

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, reopened]

jobs:
  analyze:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[trend-analysis]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aggregate SNS research patterns
        run: |
          python trend_aggregator.py \
            --input trend_test_snapshot.json \
            --output trend_report.json \
            --as-of 2026-08-29 \
            --current-days 7 \
            --baseline-days 28 \
            --min-posts 2
      - name: Validate normalization and output
        run: |
          python - <<'PY'
          import json
          d=json.load(open('trend_report.json', encoding='utf-8'))
          assert d['duplicate_rows_removed'] >= 2, d
          assert d['current_usable_rows'] > 0, d
          assert isinstance(d['signals'], list), d
          print('duplicates_removed=', d['duplicate_rows_removed'])
          print('current_usable_rows=', d['current_usable_rows'])
          print('missing_classification=', d['missing_classification_count'])
          print('signals=', len(d['signals']))
          for s in d['signals'][:10]:
              print(s['status'], s['kind'], s['name'], s['current_posts'], s['current_accounts'], s['rate_lift'], s['trend_score'])
          PY
      - name: Generate Teaflex transfer recommendations
        run: |
          python recommendation_generator.py \
            --trend trend_report.json \
            --snapshot trend_test_snapshot.json \
            --project 'Teaflex(ティーフレックス)' \
            --output campaign_recommendations.json
      - name: Validate recommendation output
        run: |
          python - <<'PY'
          import json
          d=json.load(open('campaign_recommendations.json', encoding='utf-8'))
          assert d['mode'] == 'initial_signal', d
          assert d['project_rows_in_snapshot'] >= 1, d
          assert len(d['signals_used']) >= 1, d
          assert len(d['recommendations']) >= 1, d
          print('project=', d['project'])
          print('project_rows=', d['project_rows_in_snapshot'])
          print('recommendations=', len(d['recommendations']))
          for r in d['recommendations']:
              print(r['priority'], r['hypothesis'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trend-analysis-result
          path: |
            trend_report.json
            campaign_recommendations.json
          retention-days: 7
