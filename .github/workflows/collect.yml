name: Collect SNS Creative

on:
  workflow_dispatch:
    inputs:
      url:
        description: SNS post URL
        required: true
        type: string
      folder_name:
        description: Output folder name
        required: true
        type: string
      mode:
        description: auto, image, or video
        required: true
        default: auto
        type: choice
        options:
          - auto
          - image
          - video
  issues:
    types: [opened, reopened]

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[collect]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Resolve inputs
        id: inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_URL: ${{ inputs.url }}
          INPUT_FOLDER: ${{ inputs.folder_name }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            URL="$INPUT_URL"
            FOLDER="$INPUT_FOLDER"
            MODE="$INPUT_MODE"
          else
            URL=$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^url:[[:space:]]*//p' | head -n1)
            FOLDER=$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^folder_name:[[:space:]]*//p' | head -n1)
            MODE=$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^mode:[[:space:]]*//p' | head -n1)
          fi

          if [ -z "$URL" ] || [ -z "$FOLDER" ]; then
            echo "Missing URL or folder name"
            exit 1
          fi
          if [ -z "$MODE" ]; then MODE='auto'; fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "folder=$FOLDER" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Prepare YouTube cookies
        env:
          YOUTUBE_COOKIES_PART_AA: ${{ secrets.YOUTUBE_COOKIES_PART_AA }}
          YOUTUBE_COOKIES_PART_AB: ${{ secrets.YOUTUBE_COOKIES_PART_AB }}
        run: |
          if [ -n "$YOUTUBE_COOKIES_PART_AA" ] && [ -n "$YOUTUBE_COOKIES_PART_AB" ]; then
            COOKIE_B64="$RUNNER_TEMP/youtube_cookies_gz_b64.txt"
            COOKIE_GZ="$RUNNER_TEMP/youtube_cookies.txt.gz"
            COOKIE_FILE="$RUNNER_TEMP/youtube_cookies.txt"
            printf '%s%s' "$YOUTUBE_COOKIES_PART_AA" "$YOUTUBE_COOKIES_PART_AB" > "$COOKIE_B64"
            base64 --decode "$COOKIE_B64" > "$COOKIE_GZ"
            gzip -dc "$COOKIE_GZ" > "$COOKIE_FILE"
            chmod 600 "$COOKIE_FILE"
            echo "YT_COOKIES_FILE=$COOKIE_FILE" >> "$GITHUB_ENV"
            echo "YT_COOKIES_B64_FILE=$COOKIE_B64" >> "$GITHUB_ENV"
            echo "YT_COOKIES_GZ_FILE=$COOKIE_GZ" >> "$GITHUB_ENV"
          fi

      - name: Prepare Instagram sessions
        env:
          IG_STORAGE_STATE_01: ${{ secrets.IG_STORAGE_STATE_01 }}
          IG_STORAGE_STATE_02: ${{ secrets.IG_STORAGE_STATE_02 }}
          IG_STORAGE_STATE_03: ${{ secrets.IG_STORAGE_STATE_03 }}
        run: |
          FILES=""
          for N in 01 02 03; do
            VAR="IG_STORAGE_STATE_${N}"
            VALUE="${!VAR:-}"
            if [ -n "$VALUE" ]; then
              FILE="$RUNNER_TEMP/ig_storage_state_${N}.json"
              printf '%s' "$VALUE" | base64 --decode > "$FILE"
              chmod 600 "$FILE"
              if [ -z "$FILES" ]; then
                FILES="$FILE"
              else
                FILES="$FILES:$FILE"
              fi
            fi
          done
          if [ -n "$FILES" ]; then
            echo "IG_STORAGE_STATE_FILES=$FILES" >> "$GITHUB_ENV"
          fi

      - name: Collect creative
        run: |
          python collector.py \
            --url "${{ steps.inputs.outputs.url }}" \
            --folder-name "${{ steps.inputs.outputs.folder }}" \
            --mode "${{ steps.inputs.outputs.mode }}"

      - name: Upload to Google Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_ROOT_FOLDER_ID: 10C5SsjQveUs4Vn_inj0RpkNs2VyYR30Z
        run: |
          python drive_upload.py \
            "${{ steps.inputs.outputs.folder }}" \
            "output/${{ steps.inputs.outputs.folder }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.inputs.outputs.folder }}
          path: output/${{ steps.inputs.outputs.folder }}/
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary session files
        if: always()
        run: |
          rm -f "${YT_COOKIES_FILE:-}" "${YT_COOKIES_B64_FILE:-}" "${YT_COOKIES_GZ_FILE:-}"
          if [ -n "${IG_STORAGE_STATE_FILES:-}" ]; then
            OLDIFS="$IFS"
            IFS=':'
            for FILE in $IG_STORAGE_STATE_FILES; do
              rm -f "$FILE"
            done
            IFS="$OLDIFS"
          fi
