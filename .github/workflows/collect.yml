name: Collect SNS Creative

on:
  workflow_dispatch:
    inputs:
      url:
        description: SNS post URL
        required: true
        type: string
      folder_name:
        description: Output folder name
        required: true
        type: string
      mode:
        description: auto, image, or video
        required: true
        default: auto
        type: choice
        options:
          - auto
          - image
          - video
  issues:
    types: [opened]
  push:
    branches: [main]

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Resolve inputs
        id: inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_URL: ${{ inputs.url }}
          INPUT_FOLDER: ${{ inputs.folder_name }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            URL="$INPUT_URL"
            FOLDER="$INPUT_FOLDER"
            MODE="$INPUT_MODE"
          elif [ "$EVENT_NAME" = "issues" ]; then
            if [[ "$ISSUE_TITLE" != \[collect\]* ]]; then
              echo "Not a collector issue."
              exit 0
            fi
            URL=$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^url:[[:space:]]*//p' | head -n1)
            FOLDER=$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^folder_name:[[:space:]]*//p' | head -n1)
            MODE=$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^mode:[[:space:]]*//p' | head -n1)
          else
            URL='https://x.com/Show_SylveSTAR/status/1938194153466450214'
            FOLDER='20260828_Teaflex_Show_SylveSTAR'
            MODE='image'
          fi

          if [ -z "$URL" ] || [ -z "$FOLDER" ]; then
            echo "Missing URL or folder name"
            exit 1
          fi
          if [ -z "$MODE" ]; then MODE='auto'; fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "folder=$FOLDER" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Collect creative
        run: |
          python collector.py \
            --url "${{ steps.inputs.outputs.url }}" \
            --folder-name "${{ steps.inputs.outputs.folder }}" \
            --mode "${{ steps.inputs.outputs.mode }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.inputs.outputs.folder }}
          path: output/${{ steps.inputs.outputs.folder }}/
          if-no-files-found: error
          retention-days: 7
