name: Collect SNS Creative

on:
  workflow_dispatch:
    inputs:
      url:
        description: SNS post URL
        required: true
        type: string
      folder_name:
        description: Output folder name
        required: true
        type: string
      mode:
        description: auto, image, or video
        required: true
        default: auto
        type: choice
        options:
          - auto
          - image
          - video
  issues:
    types: [opened]

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[collect]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Resolve inputs
        id: inputs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            URL='${{ inputs.url }}'
            FOLDER='${{ inputs.folder_name }}'
            MODE='${{ inputs.mode }}'
          else
            python - <<'PY'
          import os, re
          from pathlib import Path
          body = os.environ.get('ISSUE_BODY','')
          def get(key, default=''):
              m = re.search(rf'^{key}:\s*(.+)$', body, re.M)
              return m.group(1).strip() if m else default
          out = Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a') as f:
              f.write(f"url={get('url')}\n")
              f.write(f"folder={get('folder_name')}\n")
              f.write(f"mode={get('mode','auto')}\n")
          PY
            exit 0
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "folder=$FOLDER" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Collect creative
        run: |
          python collector.py \
            --url "${{ steps.inputs.outputs.url }}" \
            --folder-name "${{ steps.inputs.outputs.folder }}" \
            --mode "${{ steps.inputs.outputs.mode }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.inputs.outputs.folder }}
          path: output/${{ steps.inputs.outputs.folder }}/
          if-no-files-found: error
          retention-days: 7
