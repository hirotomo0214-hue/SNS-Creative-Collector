name: Live Operational DB Join

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, reopened]

env:
  IF_MASTER_SPREADSHEET_ID: '1OHVEtCma2ulaFpwhxTE7QQ4R5b1QBiD_SIs-PSmshls'
  AI_KPI_SPREADSHEET_ID: '1kVDxA1EeuMZHMHt8XeWZpN93a1iMOrNkaTCWivI2OJw'

jobs:
  validate-live-source:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[live-db-join]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Google credential presence
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo 'GOOGLE_SERVICE_ACCOUNT_JSON=missing'
            exit 2
          fi
          echo 'GOOGLE_SERVICE_ACCOUNT_JSON=present'
          echo 'spreadsheet IDs=configured as non-secret runtime config'
      - name: Install Google API dependencies
        run: pip install google-api-python-client==2.179.0 google-auth==2.40.3
      - name: Fetch operational DBs from Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python google_sheets_source.py
      - name: Validate operational DB schema
        run: python existing_db_adapter.py --input runtime_data/existing_db_input.json --output runtime_data/existing_db_normalized.json
      - name: Verify sensitive runtime files are ignored
        run: |
          git check-ignore runtime_data/existing_db_input.json
          git check-ignore runtime_data/existing_db_normalized.json
          test -f runtime_data/existing_db_normalized.json
          echo 'live operational DB validation=OK'
