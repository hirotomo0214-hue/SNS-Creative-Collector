name: Instagram Research

on:
  workflow_dispatch:
    inputs:
      keywords:
        description: Comma-separated Instagram discovery keywords
        required: true
        default: ティーフレックス,Teaflex,グリーンティー
        type: string
      anchor_keywords:
        description: High-confidence keywords required in accepted posts
        required: false
        default: ティーフレックス,Teaflex
        type: string
      days:
        description: Recent-day window
        required: true
        default: '7'
        type: string
      max_posts:
        description: Maximum accepted recent posts
        required: true
        default: '30'
        type: string
  issues:
    types: [opened, reopened, edited]

jobs:
  research:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[ig-research]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve research inputs
        id: inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_KEYWORDS: ${{ inputs.keywords }}
          INPUT_ANCHOR_KEYWORDS: ${{ inputs.anchor_keywords }}
          INPUT_DAYS: ${{ inputs.days }}
          INPUT_MAX_POSTS: ${{ inputs.max_posts }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            KEYWORDS="$INPUT_KEYWORDS"
            ANCHOR_KEYWORDS="$INPUT_ANCHOR_KEYWORDS"
            DAYS="$INPUT_DAYS"
            MAX_POSTS="$INPUT_MAX_POSTS"
          else
            KEYWORDS=$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^keywords:[[:space:]]*//p' | head -n1)
            ANCHOR_KEYWORDS=$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^anchor_keywords:[[:space:]]*//p' | head -n1)
            DAYS=$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^days:[[:space:]]*//p' | head -n1)
            MAX_POSTS=$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^max_posts:[[:space:]]*//p' | head -n1)
          fi
          [ -n "$KEYWORDS" ] || KEYWORDS='ティーフレックス,Teaflex,グリーンティー'
          [ -n "$ANCHOR_KEYWORDS" ] || ANCHOR_KEYWORDS='ティーフレックス,Teaflex'
          [ -n "$DAYS" ] || DAYS='7'
          [ -n "$MAX_POSTS" ] || MAX_POSTS='30'
          echo "keywords=$KEYWORDS" >> "$GITHUB_OUTPUT"
          echo "anchor_keywords=$ANCHOR_KEYWORDS" >> "$GITHUB_OUTPUT"
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "max_posts=$MAX_POSTS" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Prepare Instagram storageState files
        shell: bash
        env:
          IG_STORAGE_STATE_01: ${{ secrets.IG_STORAGE_STATE_01 }}
          IG_STORAGE_STATE_02: ${{ secrets.IG_STORAGE_STATE_02 }}
          IG_STORAGE_STATE_03: ${{ secrets.IG_STORAGE_STATE_03 }}
        run: |
          set -e
          FILES=""
          for N in 01 02 03; do
            VAR="IG_STORAGE_STATE_${N}"
            VALUE="${!VAR:-}"
            if [ -n "$VALUE" ]; then
              FILE="$RUNNER_TEMP/instagram_state_${N}.json"
              printf '%s' "$VALUE" | base64 --decode > "$FILE"
              chmod 600 "$FILE"
              if [ -z "$FILES" ]; then
                FILES="$FILE"
              else
                FILES="$FILES:$FILE"
              fi
            fi
          done
          if [ -z "$FILES" ]; then
            echo "No Instagram storageState secrets are configured"
            exit 1
          fi
          echo "IG_STORAGE_STATE_FILES=$FILES" >> "$GITHUB_ENV"

      - name: Research Instagram
        run: |
          python instagram_research_v3.py \
            --keywords "${{ steps.inputs.outputs.keywords }}" \
            --anchor-keywords "${{ steps.inputs.outputs.anchor_keywords }}" \
            --days "${{ steps.inputs.outputs.days }}" \
            --max-posts "${{ steps.inputs.outputs.max_posts }}" \
            --require-japanese \
            --output instagram_research.json

      - name: Select and deduplicate research candidates
        run: |
          python research_selector.py \
            --input instagram_research.json \
            --known-urls known_notion_urls.json \
            --output research_selection.json \
            --auto-threshold 5

      - name: Upload research result
        uses: actions/upload-artifact@v4
        with:
          name: instagram-research-result
          path: |
            instagram_research.json
            research_selection.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary Instagram sessions
        if: always()
        shell: bash
        run: |
          IFS=':' read -ra FILES <<< "${IG_STORAGE_STATE_FILES:-}"
          for FILE in "${FILES[@]}"; do
            [ -n "$FILE" ] && rm -f "$FILE"
          done
