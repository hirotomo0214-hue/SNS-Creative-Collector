name: Instagram Research

on:
  workflow_dispatch:
    inputs:
      keywords:
        description: Comma-separated Instagram research keywords
        required: true
        default: ティーフレックス,Teaflex,グリーンティー
        type: string
      days:
        description: Recent-day window
        required: true
        default: '7'
        type: string
      max_posts:
        description: Maximum recent posts to inspect
        required: true
        default: '30'
        type: string

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Prepare Instagram storageState files
        shell: bash
        env:
          IG_STORAGE_STATE_01: ${{ secrets.IG_STORAGE_STATE_01 }}
          IG_STORAGE_STATE_02: ${{ secrets.IG_STORAGE_STATE_02 }}
          IG_STORAGE_STATE_03: ${{ secrets.IG_STORAGE_STATE_03 }}
        run: |
          set -e
          FILES=""
          for N in 01 02 03; do
            VAR="IG_STORAGE_STATE_${N}"
            VALUE="${!VAR:-}"
            if [ -n "$VALUE" ]; then
              FILE="$RUNNER_TEMP/instagram_state_${N}.json"
              printf '%s' "$VALUE" | base64 --decode > "$FILE"
              chmod 600 "$FILE"
              if [ -z "$FILES" ]; then
                FILES="$FILE"
              else
                FILES="$FILES:$FILE"
              fi
            fi
          done
          if [ -z "$FILES" ]; then
            echo "No Instagram storageState secrets are configured"
            exit 1
          fi
          echo "IG_STORAGE_STATE_FILES=$FILES" >> "$GITHUB_ENV"

      - name: Research Instagram
        run: |
          python instagram_research.py \
            --keywords "${{ inputs.keywords }}" \
            --days "${{ inputs.days }}" \
            --max-posts "${{ inputs.max_posts }}" \
            --output instagram_research.json

      - name: Upload research result
        uses: actions/upload-artifact@v4
        with:
          name: instagram-research-result
          path: instagram_research.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary Instagram sessions
        if: always()
        shell: bash
        run: |
          IFS=':' read -ra FILES <<< "${IG_STORAGE_STATE_FILES:-}"
          for FILE in "${FILES[@]}"; do
            [ -n "$FILE" ] && rm -f "$FILE"
          done
